name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./cloudflare-worker.ts"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "76b1f49d-b56e-42fb-97dc-18ce6204915e"

# 观影室的 Durable Object。
[[durable_objects.bindings]]
name = "WATCH_ROOM"
class_name = "WatchRoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoomHub"]

# 定时任务
[triggers]
crons = ["0 1 * * *"]

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
CRON_WAIT_FOR_COMPLETION = "true"
USERNAME = "admin"
PASSWORD = "MoonTV2026"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
